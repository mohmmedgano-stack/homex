name: tmp bosta api shape check
on: push
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=a61c617b007f82b2fdd32c86903148f2fbbdf567ce488e577ec5500679c09ccd
          echo "== districts"; curl -s -m 20 -H "Authorization: $K" "https://app.bosta.co/api/v2/cities/Jrb6X6ucjiYgMP4T7/districts" | head -c 900; echo
