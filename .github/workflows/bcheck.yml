          echo "== districtId $D"
          U="https://stg-app.bosta.co/api/v2/deliveries?apiVersion=1"
          p() { echo "== $1"; curl -s -m 20 -X POST -H "Authorization: $K" -H "Content-Type: application/json" -d "$2" "$U" | head -c 500; echo; }
          p "districtName + bad phone" '{"type":10,"specs":{"packageType":"Parcel","size":"MEDIUM","packageDetails":{"itemsCount":1,"description":"x"}},"cod":-5,"dropOffAddress":{"city":"Jrb6X6ucjiYgMP4T7","districtName":"Smouha","firstLine":"street 1"},"receiver":{"firstName":"A","lastName":"B","phone":"123"},"businessReference":"T1"}'
          p "districtId + bad phone" "{\"type\":10,\"specs\":{\"packageType\":\"Parcel\",\"size\":\"MEDIUM\",\"packageDetails\":{\"itemsCount\":1,\"description\":\"x\"}},\"cod\":-5,\"dropOffAddress\":{\"city\":\"Jrb6X6ucjiYgMP4T7\",\"districtId\":\"$D\",\"firstLine\":\"street 1\"},\"receiver\":{\"firstName\":\"A\",\"lastName\":\"B\",\"phone\":\"123\"},\"businessReference\":\"T1\"}"
          p "districtId + good phone + neg cod" "{\"type\":10,\"specs\":{\"packageType\":\"Parcel\",\"size\":\"MEDIUM\",\"packageDetails\":{\"itemsCount\":1,\"description\":\"x\"}},\"cod\":-5,\"dropOffAddress\":{\"city\":\"Jrb6X6ucjiYgMP4T7\",\"districtId\":\"$D\",\"firstLine\":\"street 1\"},\"receiver\":{\"firstName\":\"A\",\"lastName\":\"B\",\"phone\":\"01065685435\"},\"businessReference\":\"T1\"}"
