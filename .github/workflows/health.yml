name: Live site health check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check home-x.online
        run: |
          set +e
          U=https://home-x.online
          for p in "/" "/admin/" "/p/returns" "/o/NOPE?t=x" "/robots.txt" "/sitemap.xml" "/og.png" "/logo.webp" "/fonts/eyen-ammon-bold.woff2" "/sounds/new-order.mp3" "/api/?r=settings" "/api/?r=catalog" "/api/lib.php" "/api/deploy.php?status=1"; do
            curl -s -o /tmp/body -w "%{http_code}  %{time_total}s  %{size_download}B  $p\n" -H "Accept-Encoding: gzip" "$U$p"
          done
          echo "--- redirects"
          curl -s -o /dev/null -w "http://      -> %{http_code} %{redirect_url}\n" http://home-x.online/
          curl -s -o /dev/null -w "www          -> %{http_code} %{redirect_url}\n" https://www.home-x.online/
          echo "--- headers /"
          curl -sI -H "Accept-Encoding: gzip" $U/ | grep -iE "^(content-encoding|cache-control|strict-transport|x-frame|x-content|referrer|server|content-security)"
          echo "--- headers asset"
          A=$(curl -s $U/ | grep -oE '/assets/[^"]+\.js' | head -1); echo "$A"
          curl -sI -H "Accept-Encoding: gzip" "$U$A" | grep -iE "^(content-encoding|cache-control|content-length)"
          echo "--- catalog summary"
          curl -s "$U/api/?r=catalog" | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; print('products',len(d['products']),'categories',len(d['categories']),'banners',len(d.get('banners',[]))); print('no image:',[p['name'] for p in d['products'] if not p.get('image')][:10]); print('out of stock:',sum(1 for p in d['products'] if p['stock']<=0))"
          echo "--- settings summary"
          curl -s "$U/api/?r=settings" | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; print({k:(bool(v) if k not in ('shipping_fee','store_name','pay_cod','card_ready') else v) for k,v in d.items() if k in ('store_name','phone','whatsapp','email','address','facebook','instagram','meta_pixel_id','tiktok_pixel_id','ga4_id','shipping_fee','pay_cod','card_ready','logo')})"
          echo "--- TLS"
          echo | openssl s_client -servername home-x.online -connect home-x.online:443 2>/dev/null | openssl x509 -noout -dates -issuer
