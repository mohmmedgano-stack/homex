# On every push to main: build the site and publish the ready-to-host files
# (store + /admin + /api) to the `hostinger-release` branch.
# Hostinger is pointed at that branch once the domain is bought.
name: Build Hostinger release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to hostinger-release branch
        run: |
          cd dist
          printf 'Built HOMEX site. Generated from main by CI — do not edit by hand.\n' > README.md
          git init -q -b hostinger-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Release build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hostinger-release
      - name: Tell home-x.online to install this build
        run: |
          for i in 1 2 3 4 5; do
            sleep 10
            res=$(curl -sS --max-time 120 https://home-x.online/api/deploy.php || true)
            echo "$res"
            echo "$res" | grep -q '"ok":true' && exit 0
          done
          echo "::warning::Site did not confirm the deploy"
