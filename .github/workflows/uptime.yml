name: Uptime
# Every 30 minutes from outside: is the site answering? A failed run makes GitHub email the repo owner
# (the «AppDown» alert, which the site itself can't send when it's down). The ping also runs the site's own
# alert rules, so they are checked even at night when nobody visits.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check home-x.online
        run: |
          check() {
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$1")
              if [ "$code" = "200" ] && grep -q "$2" /tmp/body; then echo "OK  $1"; return 0; fi
              echo "try $i: $code $1"; sleep 20
            done
            echo "::error::home-x.online is down: $1 answered $code"; return 1
          }
          check "https://home-x.online/api/?r=ping" '"ok":true'
          check "https://home-x.online/" 'HOMEX'
